{% extends "layout.html" %}
{% block title %}Νέα Αγορά · Stock Manager{% endblock %}
{% block content %}

<h3 class="fw-bold text-accent mb-4"><i class="bi bi-plus-circle me-2"></i>Νέα Αγορά Μετοχής</h3>

<div class="card card-stat p-4" style="max-width: 520px;">
  <form method="POST" action="{{ url_for('add') }}">
    <div class="mb-3">
      <label class="form-label">Ticker</label>
      <input type="text" name="ticker" class="form-control" placeholder="AAPL"
             value="{{ form.ticker if form.ticker }}" required autofocus>
    </div>

    <div class="mb-3">
      <label class="form-label">Αριθμός Μετοχών</label>
      <input type="number" name="shares" class="form-control" step="0.0001" min="0.0001"
             value="{{ form.shares if form.shares }}" required>
    </div>

    <div class="row">
      <div class="col-7 mb-3">
        <label class="form-label">Τιμή Αγοράς (ανά μετοχή)</label>
        <input type="number" name="buy_price" class="form-control" step="0.01" min="0.01"
               value="{{ form.buy_price if form.buy_price }}" required>
      </div>
      <div class="col-5 mb-3">
        <label class="form-label">Νόμισμα</label>
        <select name="currency" class="form-select">
          {% for c in currencies %}
          <option value="{{ c }}" {% if form.currency == c %}selected{% endif %}>{{ c }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="mb-4">
      <label class="form-label">Ημερομηνία Αγοράς</label>
      <input type="date" name="buy_date" class="form-control" value="{{ form.buy_date if form.buy_date }}" required>
    </div>

    <button type="submit" class="btn btn-accent w-100">Προσθήκη</button>
  </form>
</div>

{% endblock %}
