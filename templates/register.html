{% extends "layout.html" %}
{% block title %}Εγγραφή · Stock Manager{% endblock %}
{% block content %}
<div class="card auth-card">
  <div class="card-body p-4">
    <h3 class="card-title text-accent fw-bold mb-4"><i class="bi bi-person-plus me-2"></i>Δημιουργία Λογαριασμού</h3>
    <form method="POST" action="{{ url_for('register') }}">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Κωδικός</label>
        <input type="password" name="password" class="form-control" required minlength="6">
      </div>
      <div class="mb-3">
        <label class="form-label">Επιβεβαίωση Κωδικού</label>
        <input type="password" name="confirmation" class="form-control" required minlength="6">
      </div>
      <button type="submit" class="btn btn-accent w-100">Εγγραφή</button>
    </form>
    <p class="text-center mt-3 mb-0">
      Έχεις ήδη λογαριασμό; <a href="{{ url_for('login') }}">Σύνδεση</a>
    </p>
  </div>
</div>
{% endblock %}
